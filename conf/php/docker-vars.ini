; Production PHP / OPcache settings.
; Loaded after php.ini and the image defaults.

expose_php = Off
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000
date.timezone = UTC

upload_max_filesize = 20M
post_max_size = 24M
max_file_uploads = 20

; OPcache (shared across FPM workers)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 10
opcache.save_comments = 1
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; JIT gives no meaningful benefit for a Laravel request/response workload
; and costs memory per worker, so leave it off.
opcache.jit = off
opcache.jit_buffer_size = 0

; Filesystem stat cache
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Session cookie hardening
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
